name: Package repositories

# Gera o .deb e o .rpm de uma versão, anexa à release e publica no GitHub Pages a página
# do projeto (site/) e os repositórios APT e DNF com as três últimas. O Pages não guarda
# nada entre uma publicação e outra: os pacotes antigos vêm das releases.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The version to package, like v1.1.0
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build cmake clang pkg-config apt-utils rpm createrepo-c
      - name: Build the packages
        run: |
          flutter pub get
          tool/build-deb.sh build/deb
          tool/build-rpm.sh build/rpm --no-build
      - name: Attach the .deb to the release
        run: gh release upload "$TAG" build/deb/*.deb --clobber
      - name: Fetch the last three versions
        run: |
          mkdir -p build/pkgs
          gh release list --limit 3 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release download "$tag" --pattern '*.deb' --pattern '*.rpm' --dir build/pkgs || true
            done
          cp build/rpm/*.rpm build/pkgs/
      - name: Build the repositories
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          gpg --batch --import <<< "$APT_SIGNING_KEY"
          tool/build-apt-repo.sh build/apt build/pkgs/*.deb
          tool/build-dnf-repo.sh build/apt https://francisceioseph.github.io/psito-spider build/pkgs/*.rpm
          cp -r site/. build/apt/
      - name: Attach the signed .rpm to the release
        run: gh release upload "$TAG" "build/apt/rpm/$(basename build/rpm/*.rpm)" --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/apt
      - id: deploy
        uses: actions/deploy-pages@v4
