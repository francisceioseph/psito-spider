name: psito_spider
description: "Spider solitaire with cockatiels. No ads, no telemetry, no account."
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  psito_games_ui:
    git:
      url: https://github.com/francisceioseph/psito-games-ui
      ref: v1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cards/
    - assets/slots/
  fonts:
    - family: CardSerif
      fonts:
        - asset: assets/fonts/CardSerif-Bold.ttf

# The sounds are WAV: the Ogg, Vorbis, Opus and FLAC codecs of the sound engine
# would only make the packages bigger.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
